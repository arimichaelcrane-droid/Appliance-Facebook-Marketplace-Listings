  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f5f5f4;
    --bg3: #eeece8;

    --green-text: #3b6d11;

    --gray-text: #5f5e5a;
    --blue-bg: #e6f1fb;
    --blue-text: #185fa5;
    --red-bg: #fcebeb;
    --red-text: #a32d2d;
    --radius: 8px;
    --radius-lg: 12px;
  }

  body {

    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
