<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketplace Inventory</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f5f5f4;
    --bg3: #eeece8;
    --text: #1a1a1a;
    --text2: #6b6b6b;
    --text3: #9e9e9e;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --green-bg: #eaf3de;
    --green-text: #3b6d11;
    --amber-bg: #faeeda;
    --amber-text: #854f0b;
    --gray-bg: #e8e8e6;
    --gray-text: #5f5e5a;
    --blue-bg: #e6f1fb;
    --blue-text: #185fa5;
    --red-bg: #fcebeb;
    --red-text: #a32d2d;
    --radius: 8px;
    --radius-lg: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg3);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  header {
    background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    padding: 0 2rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header .logo {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }

  header .logo span {
    color: var(--text2);
    font-weight: 400;
  }

  .header-right { display: flex; gap: 8px; align-items: center; }

  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .badge-admin { background: var(--amber-bg); color: var(--amber-text); }
  .badge-team  { background: var(--bg2); color: var(--text2); }

  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .stat-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
  }
  .stat-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  .stat-val   { font-size: 22px; font-weight: 600; color: var(--text); }
  .stat-val.green { color: var(--green-text); }
  .stat-val.amber { color: var(--amber-text); }

  .add-section {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .section-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 1rem;
    color: var(--text);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }

  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }

  .form-group label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    font-size: 13px;
    font-family: inherit;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 0 10px;
    height: 36px;
    background: var(--bg);
    color: var(--text);
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: #999;
  }

  .form-group input.error { border-color: var(--red-text); }

  .form-group textarea {
    height: 68px;
    padding: 8px 10px;
    resize: none;
    line-height: 1.5;
  }

  .form-bottom { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }

  .flash-msg {
    font-size: 12px;
    color: var(--green-text);
    background: var(--green-bg);
    padding: 6px 12px;
    border-radius: var(--radius);
    display: none;
  }

  .btn-primary {
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.82; }

  .btn-ghost {
    background: transparent;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text2);
    font-family: inherit;
    transition: background 0.12s;
    white-space: nowrap;
  }
  .btn-ghost:hover { background: var(--bg2); }
  .btn-ghost.danger:hover { background: var(--red-bg); color: var(--red-text); border-color: var(--red-text); }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 1rem;
    align-items: center;
  }

  .toolbar input[type=text] {
    flex: 1;
    height: 34px;
    padding: 0 10px;
    font-size: 13px;
    font-family: inherit;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .toolbar input[type=text]:focus { border-color: #999; }

  .toolbar select {
    height: 34px;
    padding: 0 8px;
    font-size: 13px;
    font-family: inherit;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    outline: none;
    min-width: 140px;
  }

  .table-wrap {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    table-layout: fixed;
  }

  thead tr { border-bottom: 0.5px solid var(--border); }

  th {
    text-align: left;
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    background: var(--bg2);
  }

  td {
    padding: 10px 14px;
    border-bottom: 0.5px solid var(--border);
    vertical-align: middle;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafafa; }

  .pill {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    display: inline-block;
    white-space: nowrap;
  }
  .pill-available { background: var(--green-bg); color: var(--green-text); }
  .pill-pending   { background: var(--amber-bg); color: var(--amber-text); }
  .pill-sold      { background: var(--gray-bg);  color: var(--gray-text);  }

  .item-name { font-weight: 500; color: var(--text); }
  .item-name.sold { color: var(--text3); text-decoration: line-through; }

  .cond-text { font-size: 12px; color: var(--text2); }
  .notes-text { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .date-text  { font-size: 12px; color: var(--text3); }

  a.view-link {
    font-size: 12px;
    color: var(--blue-text);
    text-decoration: none;
  }
  a.view-link:hover { text-decoration: underline; }

  .actions-cell { display: flex; gap: 5px; flex-wrap: wrap; }

  .col-name    { width: 26%; }
  .col-price   { width: 9%;  }
  .col-cond    { width: 13%; }
  .col-status  { width: 11%; }
  .col-added   { width: 9%;  }
  .col-notes   { width: 16%; }
  .col-link    { width: 7%;  }
  .col-actions { width: 15%; }

  .empty-state {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text3);
  }
  .empty-state p { font-size: 14px; margin-top: 8px; }

  .login-wrap {
    max-width: 360px;
    margin: 4rem auto;
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem;
  }
  .login-wrap h2 { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; }
  .login-wrap input {
    width: 100%;
    height: 38px;
    padding: 0 10px;
    font-size: 13px;
    font-family: inherit;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    margin-bottom: 10px;
    outline: none;
  }
  .login-wrap input:focus { border-color: #999; }
  .err { font-size: 12px; color: var(--red-text); margin: 4px 0 8px; }

  @media (max-width: 700px) {
    .stats-row { grid-template-columns: 1fr 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    main { padding: 1rem; }
    header { padding: 0 1rem; }
    th.col-notes, td.col-notes,
    th.col-added, td.col-added { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Marketplace <span>Inventory</span></div>
  <div class="header-right" id="header-right"></div>
</header>

<main id="main"></main>

<script>
const ADMIN_PASS = "appliances2024";
const KEY = "mp_inventory_v1";

let items = [];
let adminLoggedIn = false;
let loginErr = "";
let filterStatus = "all";
let filterSearch = "";

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) items = JSON.parse(raw);
  } catch(e) {}
  render();
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e) {}
}

function fmt(p) {
  const n = parseFloat(p);
  if (isNaN(n)) return "—";
  return "$" + n.toLocaleString("en-US", {minimumFractionDigits:0, maximumFractionDigits:0});
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return (d.getMonth()+1) + "/" + d.getDate() + "/" + d.getFullYear().toString().slice(2);
}

function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function filtered() {
  return items.filter(i => {
    const ms = filterStatus === "all" || i.status === filterStatus;
    const q = filterSearch.toLowerCase();
    const mq = !q || i.name.toLowerCase().includes(q)
                   || (i.condition||"").toLowerCase().includes(q)
                   || (i.notes||"").toLowerCase().includes(q);
    return ms && mq;
  });
}

function statsCalc() {
  const avail = items.filter(i => i.status === "available");
  return {
    total:     items.length,
    available: avail.length,
    pending:   items.filter(i => i.status === "pending").length,
    sold:      items.filter(i => i.status === "sold").length,
    value:     avail.reduce((s,i) => s + (parseFloat(i.price)||0), 0)
  };
}

function addItem() {
  const name  = (document.getElementById("f-name")  ||{}).value || "";
  const price = (document.getElementById("f-price") ||{}).value || "";
  const cond  = (document.getElementById("f-cond")  ||{}).value || "Open Box";
  const url   = (document.getElementById("f-url")   ||{}).value || "";
  const notes = (document.getElementById("f-notes") ||{}).value || "";

  const nameEl = document.getElementById("f-name");
  if (!name.trim()) {
    if (nameEl) { nameEl.classList.add("error"); nameEl.focus(); }
    return;
  }
  if (nameEl) nameEl.classList.remove("error");

  items.unshift({
    id:      Date.now().toString(),
    name:    name.trim(),
    price:   price,
    condition: cond,
    notes:   notes.trim(),
    url:     url.trim(),
    status:  "available",
    addedAt: new Date().toISOString()
  });

  save();

  ["f-name","f-price","f-url","f-notes"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  const condEl = document.getElementById("f-cond");
  if (condEl) condEl.value = "Open Box";

  const flash = document.getElementById("flash");
  if (flash) {
    flash.style.display = "block";
    setTimeout(() => { flash.style.display = "none"; }, 3000);
  }

  renderStats();
  renderTable();
}

function setStatus(id, status) {
  const it = items.find(i => i.id === id);
  if (it) {
    it.status = status;
    if (status === "sold") it.soldAt = new Date().toISOString();
  }
  save();
  renderStats();
  renderTable();
}

function delItem(id) {
  if (!confirm("Remove this item from inventory?")) return;
  items = items.filter(i => i.id !== id);
  save();
  renderStats();
  renderTable();
}

function doLogin() {
  const el = document.getElementById("pw");
  const val = el ? el.value : "";
  if (val === ADMIN_PASS) {
    adminLoggedIn = true;
    loginErr = "";
    render();
  } else {
    loginErr = "Incorrect password.";
    renderLogin();
  }
}

function renderHeader() {
  const el = document.getElementById("header-right");
  if (!el) return;
  el.innerHTML = adminLoggedIn
    ? `<span class="badge badge-admin">Admin</span>
       <button class="btn-ghost" onclick="adminLoggedIn=false;render()">Sign out</button>`
    : `<span class="badge badge-team">Team view</span>
       <button class="btn-ghost" onclick="showLogin()">&#9881; Admin</button>`;
}

function renderStats() {
  const el = document.getElementById("stats-row");
  if (!el) return;
  const s = statsCalc();
  el.innerHTML = `
    <div class="stat-card"><div class="stat-label">Total listings</div><div class="stat-val">${s.total}</div></div>
    <div class="stat-card"><div class="stat-label">Available</div><div class="stat-val green">${s.available}</div></div>
    <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-val amber">${s.pending}</div></div>
    <div class="stat-card"><div class="stat-label">Available value</div><div class="stat-val">${fmt(s.value)}</div></div>`;
}

function renderTable() {
  const tbody = document.getElementById("inv-tbody");
  const thead = document.getElementById("inv-thead");
  if (!tbody) return;

  if (thead) {
    thead.innerHTML = `
      <tr>
        <th class="col-name">Item</th>
        <th class="col-price">Price</th>
        <th class="col-cond">Condition</th>
        <th class="col-status">Status</th>
        <th class="col-added">Added</th>
        <th class="col-notes">Notes</th>
        <th class="col-link">Listing</th>
        ${adminLoggedIn ? `<th class="col-actions">Actions</th>` : ""}
      </tr>`;
  }

  const list = filtered();

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${adminLoggedIn?8:7}">
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14M5 8a2 2 0 1 0-4 0v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8m-14 0V6a2 2 0 1 1 4 0v2"/></svg>
        <p>${items.length === 0 ? "No listings yet — sign in as admin to add items." : "No items match your filters."}</p>
      </div>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(it => {
    const pill = `<span class="pill pill-${it.status}">${it.status === "available" ? "Available" : it.status === "sold" ? "Sold" : "Pending"}</span>`;
    const nameClass = it.status === "sold" ? "item-name sold" : "item-name";
    const linkCell = it.url
      ? `<a class="view-link" href="${esc(it.url)}" target="_blank" rel="noopener">View ↗</a>`
      : `<span style="color:#ccc">—</span>`;
    const actions = adminLoggedIn ? `
      <div class="actions-cell">
        ${it.status !== "available" ? `<button class="btn-ghost" onclick="setStatus('${it.id}','available')">Available</button>` : ""}
        ${it.status !== "pending"   ? `<button class="btn-ghost" onclick="setStatus('${it.id}','pending')">Pending</button>` : ""}
        ${it.status !== "sold"      ? `<button class="btn-ghost" onclick="setStatus('${it.id}','sold')">Sold</button>` : ""}
        <button class="btn-ghost danger" onclick="delItem('${it.id}')" title="Delete">&#128465;</button>
      </div>` : "";
    return `<tr>
      <td class="col-name"><span class="${nameClass}">${esc(it.name)}</span></td>
      <td class="col-price">${fmt(it.price)}</td>
      <td class="col-cond"><span class="cond-text">${esc(it.condition||"")}</span></td>
      <td class="col-status">${pill}</td>
      <td class="col-added"><span class="date-text">${fmtDate(it.addedAt)}</span></td>
      <td class="col-notes"><div class="notes-text" title="${esc(it.notes||"")}">${esc(it.notes||"")}</div></td>
      <td class="col-link">${linkCell}</td>
      ${adminLoggedIn ? `<td class="col-actions">${actions}</td>` : ""}
    </tr>`;
  }).join("");
}

function renderLogin() {
  const main = document.getElementById("main");
  if (!main) return;
  main.innerHTML = `
    <div class="login-wrap">
      <h2>Admin sign in</h2>
      <input type="password" id="pw" placeholder="Password" />
      ${loginErr ? `<div class="err">${esc(loginErr)}</div>` : ""}
      <button class="btn-primary" style="width:100%" onclick="doLogin()">Sign in</button>
      <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="adminLoggedIn=false;render()">Back to team view</button>
    </div>`;
  const pw = document.getElementById("pw");
  if (pw) pw.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  renderHeader();
}

function showLogin() {
  adminLoggedIn = false;
  loginErr = "";
  renderLogin();
}

function render() {
  const main = document.getElementById("main");
  if (!main) return;

  main.innerHTML = `
    <div class="stats-row" id="stats-row"></div>

    ${adminLoggedIn ? `
    <div class="add-section">
      <div class="section-title">Add new listing</div>
      <div id="flash" class="flash-msg">&#10003; Item added to inventory.</div>
      <div class="form-grid">
        <div class="form-group full">
          <label>Item name *</label>
          <input type="text" id="f-name" placeholder='e.g. Wolf 36" Dual Fuel Range — Scratch &amp; Dent' />
        </div>
        <div class="form-group">
          <label>Price</label>
          <input type="number" id="f-price" placeholder="e.g. 2400" min="0" />
        </div>
        <div class="form-group">
          <label>Condition</label>
          <select id="f-cond">
            <option value="Open Box">Open Box</option>
            <option value="Scratch &amp; Dent">Scratch &amp; Dent</option>
            <option value="Like New">Like New</option>
            <option value="Used - Good">Used - Good</option>
            <option value="Clearance">Clearance</option>
            <option value="Out of Box">Out of Box</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Facebook Marketplace listing URL</label>
          <input type="text" id="f-url" placeholder="https://www.facebook.com/marketplace/item/..." />
        </div>
        <div class="form-group full">
          <label>Notes <span style="font-weight:400;color:#999">(optional — visible to sales team)</span></label>
          <textarea id="f-notes" placeholder="e.g. Minor cosmetic scratch on left side panel. Full warranty included."></textarea>
        </div>
      </div>
      <div class="form-bottom">
        <span id="flash-inline" class="flash-msg"></span>
        <button class="btn-primary" onclick="addItem()">Add to inventory</button>
      </div>
    </div>` : ""}

    <div class="toolbar">
      <input type="text" id="search-input" placeholder="Search by name, condition, or notes..." value="${esc(filterSearch)}" />
      <select id="status-filter">
        <option value="all"       ${filterStatus==="all"?"selected":""}>All statuses</option>
        <option value="available" ${filterStatus==="available"?"selected":""}>Available</option>
        <option value="pending"   ${filterStatus==="pending"?"selected":""}>Pending</option>
        <option value="sold"      ${filterStatus==="sold"?"selected":""}>Sold</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="inv-thead"></thead>
        <tbody id="inv-tbody"></tbody>
      </table>
    </div>`;

  document.getElementById("search-input").addEventListener("input", function() {
    filterSearch = this.value;
    renderTable();
  });
  document.getElementById("status-filter").addEventListener("change", function() {
    filterStatus = this.value;
    renderTable();
  });

  renderHeader();
  renderStats();
  renderTable();
}

load();
</script>
</body>
</html>
